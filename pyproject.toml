[project]
name = "legend-lore"
version = "0.1.0"
description = "Player-attributed transcripts for D&D actual-play audio"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Model stack verified on 2026-10-22; ffmpeg must be on PATH.
    "openai-whisper==20250625",
    "pyannote.audio==3.4.0",
    # pyannote 3.4.0 uses use_auth_token, removed in huggingface-hub >= 1.0.
    "huggingface-hub==0.25.2",
    "pyannote.metrics==3.2.1",
    "pyannote.database==5.1.3",
    # torch >= 2.6 needs the weights_only shim in dnd_notetaker/hf.py.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "numpy==2.0.2",
    "soundfile==0.13.1",
    "jiwer==4.0.0",
    "yt-dlp==2025.10.14",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dnd_notetaker"]
